<title>Neuron Breadboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EDF1F5; --panel:#F8FAFC; --panel2:#FFFFFF; --grid:#DDE4EC; --grid2:#C8D2DD;
  --ink:#15202B; --muted:#586677; --line:#C6D0DB;
  --glut:#2F5DA8; --gaba:#BF3A2B; --spike:#C98A06; --inn:#4B5563;
  --ok:#2E7D4F; --bad:#B42318; --okbg:#E3F2E9; --badbg:#FBE7E5;
  --sans:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --cond:"IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#10161D; --panel:#161E27; --panel2:#1B2531; --grid:#1C2631; --grid2:#263444;
    --ink:#E4E9EF; --muted:#93A1B1; --line:#2E3C4B;
    --glut:#86ACEA; --gaba:#F08C7F; --spike:#F2C14E; --inn:#A9B4C2;
    --ok:#62C48F; --bad:#F2806F; --okbg:#173326; --badbg:#3A1C19;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#10161D; --panel:#161E27; --panel2:#1B2531; --grid:#1C2631; --grid2:#263444;
  --ink:#E4E9EF; --muted:#93A1B1; --line:#2E3C4B;
  --glut:#86ACEA; --gaba:#F08C7F; --spike:#F2C14E; --inn:#A9B4C2;
  --ok:#62C48F; --bad:#F2806F; --okbg:#173326; --badbg:#3A1C19;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);padding-inline:16px;padding-block:14px 28px}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px}
.brand{font:600 12px/1 var(--cond);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font:700 30px/1.1 var(--cond);margin:4px 0 0;text-wrap:balance}
h1 .watt{color:var(--spike)}
.langs{display:flex;gap:6px}
button{font:inherit;color:inherit;cursor:pointer}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 10px;font:600 13px/1.2 var(--cond);letter-spacing:.04em}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:focus-visible,.tool:focus-visible,.ch:focus-visible,input:focus-visible{outline:2px solid var(--spike);outline-offset:2px}
.bench{display:grid;grid-template-columns:250px minmax(0,1fr) 290px;gap:14px;align-items:start}
@media (max-width:1060px){.bench{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.eyebrow{font:600 11px/1 var(--cond);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.chlist{display:flex;flex-direction:column;gap:6px}
.ch{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:7px 9px}
.ch .num{font:500 12px var(--mono);color:var(--muted)}
.ch .nm{font-weight:500;font-size:14px;line-height:1.25}
.ch .st{font:600 11px var(--cond);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ch .st.done{color:var(--ok)}
.ch[aria-current="true"]{border-color:var(--ink);box-shadow:inset 3px 0 0 var(--spike)}
.task h2{font:700 20px/1.2 var(--cond);margin:0;text-wrap:balance}
.task p{margin:0;color:var(--ink)}
.hints{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:13.5px;color:var(--ink)}
.hints li::marker{color:var(--spike);font:600 13px var(--mono)}
.hints li:focus{outline:none}
#hintbtn{align-self:flex-start}
.solbox{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.solbox p{margin:0}
#hintbtn:disabled{opacity:.55;cursor:default}
.parts{display:flex;flex-wrap:wrap;gap:6px}
.part{font:600 12px/1 var(--cond);letter-spacing:.05em;padding:5px 7px;border-radius:4px;border:1px solid var(--line);color:var(--muted)}
.part.on{color:var(--ink)}
.part .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0}
.boardcol{display:flex;flex-direction:column;gap:10px;min-width:0}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tool{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 10px;font:600 13px/1.2 var(--cond);letter-spacing:.03em;display:inline-flex;gap:6px;align-items:center}
.tool[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tool:disabled{opacity:.45;cursor:not-allowed}
.tool .sw{width:10px;height:10px;border-radius:50%}
.lock{font:500 11px var(--mono);opacity:.8}
.spacer{flex:1}
.canvasbox{background:var(--panel2);border:1px solid var(--line);border-radius:8px;overflow:hidden}
canvas{display:block;width:100%;touch-action:none}
#board{aspect-ratio:760/420;cursor:crosshair}
.rastercap{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.score{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.metric{display:flex;flex-direction:column;gap:2px}
.metric b{font:500 22px/1.1 var(--mono);font-variant-numeric:tabular-nums}
.metric span{font:600 11px/1.2 var(--cond);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.status{border-radius:6px;padding:8px 10px;font-weight:600;font-size:14px}
.status.ok{background:var(--okbg);color:var(--ok)}
.status.bad{background:var(--badbg);color:var(--bad)}
.record{font-size:13px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font:600 11px var(--cond);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:4px 4px;border-bottom:1px solid var(--line)}
td{padding:5px 4px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
tr.test{cursor:pointer}
tr.test[aria-selected="true"] td{background:var(--panel2)}
td.mono{font-family:var(--mono)}
.pass{color:var(--ok);font-weight:600}.fail{color:var(--bad);font-weight:600}
.boardbox{position:relative}
.boardhint{position:absolute;left:12px;right:12px;bottom:10px;text-align:center;font-size:13px;line-height:1.35;color:var(--muted);pointer-events:none;text-wrap:balance}
.pop{position:absolute;z-index:2;width:236px;background:var(--panel);border:1px solid var(--ink);border-radius:8px;padding:10px 11px;display:flex;flex-direction:column;gap:7px;box-shadow:0 6px 22px rgba(0,0,0,.28)}
.pop.dock{position:static;width:auto;border:0;border-top:1px solid var(--line);border-radius:0;box-shadow:none}
.pop .ph{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pop .ph b{font:700 14px/1.2 var(--cond)}
.pop .x{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:0 2px}
.pf{display:grid;grid-template-columns:1fr 64px;gap:4px 8px;align-items:center;font-size:13px}
.pf label{grid-column:1/-1;color:var(--muted);font-size:12.5px}
.pf input[type=range]{width:100%;accent-color:var(--spike)}
.pf input[type=number]{width:100%;font:500 13px var(--mono);padding:3px 5px;border:1px solid var(--line);border-radius:5px;background:var(--panel2);color:var(--ink)}
.pst{font:600 12.5px/1.2 var(--sans);padding:5px 7px;border-radius:5px}
.pst.ok{background:var(--okbg);color:var(--ok)} .pst.bad{background:var(--badbg);color:var(--bad)}
.pop .danger{align-self:flex-start;border:1px solid var(--line);background:transparent;color:var(--bad);border-radius:6px;padding:4px 9px;font:600 12.5px/1.2 var(--cond)}
.palette-lbl{font:600 11px/1 var(--cond);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.tool{touch-action:none}
.ghost-part{position:fixed;z-index:5;pointer-events:none;width:38px;height:38px;border-radius:50%;border:2.5px solid var(--glut);background:var(--panel2);opacity:.85;transform:translate(-50%,-50%)}
.field{display:grid;grid-template-columns:1fr 92px;gap:8px;align-items:center;font-size:14px}
.field input{width:100%;font:500 14px var(--mono);padding:5px 7px;border:1px solid var(--line);border-radius:5px;background:var(--panel2);color:var(--ink)}
.small{font-size:13px;color:var(--muted)}
.share{display:flex;flex-direction:column;gap:6px}
.share input{width:100%;font:12px var(--mono);padding:6px 7px;border:1px solid var(--line);border-radius:5px;background:var(--panel2);color:var(--ink)}
.row{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:6px;padding:6px 11px;font:600 13px/1.2 var(--cond);letter-spacing:.04em}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
footer{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
footer code{font-family:var(--mono);font-size:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="brand" data-i="brand"></div>
      <h1 id="title"></h1>
    </div>
    <div class="langs" role="group" aria-label="Language">
      <button class="chip" id="lang-ru" aria-pressed="false">RU</button>
      <button class="chip" id="lang-en" aria-pressed="false">EN</button>
    </div>
  </header>

  <div class="bench">
    <aside class="panel" aria-labelledby="chal-h">
      <div class="eyebrow" id="chal-h" data-i="challenges"></div>
      <div class="chlist" id="chlist"></div>
      <div class="task" id="task" style="display:flex;flex-direction:column;gap:8px"></div>
    </aside>

    <section class="boardcol">
      <div class="toolbar" id="palette" role="group"></div>
      <div class="canvasbox boardbox" id="boardbox"><canvas id="board" aria-label="Breadboard"></canvas><div class="boardhint" id="boardhint" hidden></div><div class="pop" id="pop" hidden></div></div>
      <div class="rastercap"><span id="rastercap"></span><span data-i="rasterhint"></span></div>
      <div class="canvasbox"><canvas id="raster" aria-label="Impulse raster"></canvas></div>
    </section>

    <aside class="panel">
      <div class="eyebrow" data-i="score"></div>
      <div class="status" id="status"></div>
      <div class="score">
        <div class="metric"><b id="m-neu">0</b><span data-i="neurons"></span></div>
        <div class="metric"><b id="m-imp">0</b><span data-i="impulses"></span></div>
        <div class="metric"><b id="m-en">0</b><span data-i="energy"></span></div>
      </div>
      <div class="record" id="record"></div>
      <table>
        <thead><tr><th data-i="test"></th><th data-i="expect"></th><th data-i="got"></th><th></th></tr></thead>
        <tbody id="tests"></tbody>
      </table>
      <div class="eyebrow" data-i="share"></div>
      <div class="share">
        <div class="row">
          <button class="btn" id="copy" type="button"></button>
          <button class="btn ghost" id="reset" type="button"></button>
        </div>
        <label class="small" for="sharecode" data-i="sharelbl"></label>
        <input id="sharecode" readonly>
        <label class="small" for="loadcode" data-i="loadlbl"></label>
        <div class="row" style="flex-wrap:nowrap">
          <input id="loadcode" placeholder="bb.…">
          <button class="btn ghost" id="load" type="button"></button>
        </div>
        <div class="small" id="sharemsg" role="status"></div>
      </div>
    </aside>
  </div>

  <footer id="foot"></footer>
</div>

<script>
(function(){
"use strict";
// ---------- strings ----------
const S = {
  ru:{ brand:"Компьютер на 20 ваттах · глава 2–3", title:'Макетная плата <span class="watt">·</span> собери машину сам',
    challenges:"Задачи", parts:"Детали", score:"Результат", neurons:"нейронов", impulses:"имп./ответ", energy:"пДж/ответ",

    copied:"Ссылка скопирована.", copyfail:"Не удалось скопировать: выделите ссылку в поле и скопируйте вручную.", loaded:"Схема открыта.", badcode:"Код не распознан: проверьте, что он скопирован целиком.",

  },
  en:{ brand:"The 20-Watt Computer · chapters 2–3", title:'Neuron Breadboard <span class="watt">·</span> build the machine yourself',

const T = (ru,en)=>({ru,en});
const CH = [
 {id:"or", allowed:["glut"], record:1,

function fresh(ch){
  const c={nodes:[{id:"A",t:"in",x:70,y:120},{id:"B",t:"in",x:70,y:300},{id:"OUT",t:"out",x:670,y:210,tau:5,th:1}],wires:[],next:1};
  ch.start.forEach(([f,to,w,d])=>c.wires.push({id:"w"+(c.next++),f,to,w,d}));
  return c;
}
function fromSol(ch){ const c=fresh(ch); c.wires=[]; c.nodes=c.nodes.filter(n=>n.t==="in"||n.t==="out");
  ch.sol.n.forEach(([id,t,x,y,tau,th])=>c.nodes.push({id,t,x,y,tau,th})); ch.sol.w.forEach(([f,to,w,d])=>c.wires.push({id:"w"+(c.next++),f,to,w,d}));
  c.nodes.forEach(n=>{ const m=/^n(\d+)$/.exec(n.id); if(m) c.next=Math.max(c.next,+m[1]+1); }); return c; }
function circ(){ const ch=CH[cur]; if(!circuits[ch.id]) circuits[ch.id]=fresh(ch); return circuits[ch.id]; }
const nodeById=(c,id)=>c.nodes.find(n=>n.id===id);

// ---------- simulator: leaky integrate-and-fire, continuous time (Euler dt = 0.05 ms) ----------
function simulate(c, test){
  const dt=0.05, TT=40, K=Math.round(TT/dt);
  const neu=c.nodes.filter(n=>n.t!=="in"), idx=new Map(); neu.forEach((n,i)=>idx.set(n.id,i));
  const V=new Float64Array(neu.length), refr=new Float64Array(neu.length).fill(-1);
  const decay=neu.map(n=>Math.exp(-dt/Math.max(0.05,+n.tau||5)));
  const spikes=new Map(c.nodes.map(n=>[n.id,[]])), q=new Map(), outs=new Map(c.nodes.map(n=>[n.id,[]]));
  c.wires.forEach(w=>{ const s=nodeById(c,w.f); if(!s||!nodeById(c,w.to)) return; outs.get(w.f).push([w.to,(s.t==="gaba"?-1:1)*Math.abs(+w.w||0),Math.max(1,Math.round((+w.d||0)/dt))]); });
  function emit(id,k){ spikes.get(id).push(k*dt); for(const [to,ww,s] of outs.get(id)){ const i=idx.get(to); if(i===undefined) continue; const kk=k+s; if(kk>K) continue; if(!q.has(kk)) q.set(kk,[]); q.get(kk).push([i,ww]); } }
  const inSteps=[]; c.nodes.forEach(n=>{ if(n.t==="in") (test[n.id]||[]).forEach(ts=>inSteps.push([Math.round(ts/dt),n.id])); });
  const iOut=idx.get("OUT"), trace=[];
  for(let k=0;k<=K;k++){
    const t=k*dt;
    for(const [ks,id] of inSteps) if(ks===k) emit(id,k);
    for(let i=0;i<neu.length;i++) V[i]*=decay[i];
    const arr=q.get(k); if(arr) for(const [i,ww] of arr) if(t>=refr[i]) V[i]+=ww;
    for(let i=0;i<neu.length;i++){
      if(t<refr[i]){ V[i]=0; continue; }
      if(V[i]>=(+neu[i].th||1)){ emit(neu[i].id,k); V[i]=0; refr[i]=t+1.0; }
    }
    if(k%4===0) trace.push(V[iOut]);
  }
  return {spikes,trace,dt:dt*4,T:TT};
}
function evaluate(){
  const ch=CH[cur], c=circ();
  const bad=c.nodes.find(n=>(n.t==="glut"||n.t==="gaba")&&!ch.allowed.includes(n.t));
  const runs=ch.tests.map(tt=>simulate(c,tt));
  let total=0; runs.forEach(r=>{ for(const [id,s] of r.spikes){ const n=nodeById(c,id); if(n&&n.t!=="in") total+=s.length; } });
  const res=ch.tests.map((tt,i)=>{ const got=runs[i].spikes.get("OUT").length>0?1:0; return {got,ok:got===tt.e}; });
  const neurons=c.nodes.filter(n=>n.t!=="in").length;
  const imp=total/ch.tests.length;
  const passed=res.filter(r=>r.ok).length, solved=!bad&&passed===res.length;
  if(solved){ const b=best[ch.id]; if(!b||neurons<b.n||(neurons===b.n&&imp<b.i)) best[ch.id]={n:neurons,i:+imp.toFixed(2),h:hintsUsed[ch.id]||0,s:solSeen[ch.id]?1:0}; }
  return {runs,res,neurons,imp,passed,solved,bad};
}

function renderResults(keepInsp){
  const L=S[lang], ch=CH[cur]; state=evaluate(); store();
  $("m-neu").textContent=state.neurons; $("m-imp").textContent=state.imp.toFixed(1); $("m-en").textContent=Math.round(state.imp*100);

    tr.innerHTML=`<td>${tt.n[lang]}</td><td class="mono">${tt.e?L.yes:L.no}</td><td class="mono">${r.got?L.yes:L.no}</td><td class="${r.ok?"pass":"fail"}">${r.ok?"✓":"✗"}</td>`;
    const pick=()=>{ selTest=i; renderResults(); }; tr.onclick=pick; tr.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); pick(); } };

function renderPop(){
  const L=S[lang], c=circ(), box=$("pop");
  if(!sel){ box.hidden=true; box.innerHTML=""; return; }
  let head="", body="";
  if(sel.kind==="node"){ const n=nodeById(c,sel.id); if(!n){ sel=null; return renderPop(); }
    head=n.t==="in"?n.id:n.t==="out"?"OUT · ГЛУТ":`${n.id} · ${n.t==="gaba"?"ГАМК":"ГЛУТ"}`;
    if(n.t==="in") body=`<div class="small">${L.inputnode}</div>`;
    else { body=(n.t==="out"?`<div class="small">${L.outnode}</div>`:"")+pfield("p-tau",L.tau,n.tau,0.5,50,0.5)+pfield("p-th",L.th,n.th,0.1,5,0.1)+(n.t==="out"?"":`<button class="danger" id="p-del" type="button">${L.delnode}</button>`); }
  } else { const w=c.wires.find(x=>x.id===sel.id); if(!w){ sel=null; return renderPop(); }
    const sn=nodeById(c,w.f); const sg=sn&&sn.t==="gaba"?-1:1;
    head=`${w.f==="OUT"?"OUT":w.f} → ${w.to}`;
    body=`<div class="small">${L.sign(sg)}</div>`+pfield("p-w",L.w,w.w,0.05,5,0.05)+pfield("p-d",L.d,w.d,0.1,20,0.1)+`<button class="danger" id="p-del" type="button">${L.delwire}</button>`;
  }
  box.innerHTML=`<div class="ph"><b>${head}</b><button class="x" id="p-x" type="button" aria-label="${L.close}">×</button></div>${body}<div class="pst" id="p-st" role="status"></div>`; box.hidden=false; popStatus();
  $("p-x").onclick=()=>{ sel=null; renderResults(); };
  if($("p-del")) $("p-del").onclick=()=>removeSel();
  if(sel.kind==="node"){ const n=nodeById(c,sel.id); if(n.t!=="in"){ pbind("p-tau",v=>n.tau=v); pbind("p-th",v=>n.th=v); } }
  else { const w=c.wires.find(x=>x.id===sel.id); pbind("p-w",v=>w.w=v); pbind("p-d",v=>w.d=v); }

function popStatus(){ const el=$("p-st"); if(!el||!state) return; const L=S[lang]; el.className="pst "+(state.solved?"ok":"bad"); el.textContent=(state.solved?L.solved+" ":"")+L.pass(state.passed,state.res.length); }
function pfield(id,label,val,min,max,step){ return `<div class="pf"><label for="${id}n">${label}</label><input id="${id}r" type="range" min="${min}" max="${max}" step="${step}" value="${val}" aria-label="${label}"><input id="${id}n" type="number" min="${min}" max="${max}" step="${step}" value="${val}"></div>`; }
function pbind(id,set){ const r=$(id+"r"), n=$(id+"n");
  const apply=(v,from)=>{ if(!isFinite(v)) return; v=Math.min(+n.max,Math.max(+n.min,v)); set(v); if(from!==r) r.value=v; if(from!==n) n.value=+v.toFixed(2); renderResults(true); };
  r.addEventListener("input",()=>apply(parseFloat(r.value),r)); n.addEventListener("input",()=>apply(parseFloat(n.value),n)); }
// place the popover next to the selected element, inside the board; on narrow boards dock it under the board
function placePop(){
  const box=$("pop"); if(box.hidden||!sel) return; const bb=$("boardbox"), bw=bb.clientWidth, bh=bb.clientHeight, s=bw/W, c=circ();
  if(bw<560){ box.classList.add("dock"); box.style.left=box.style.top=""; return; } box.classList.remove("dock");
  let ax, ay;
  if(sel.kind==="node"){ const n=nodeById(c,sel.id); if(!n) return; ax=n.x*s; ay=n.y*s; }
  else { const w=c.wires.find(x=>x.id===sel.id); if(!w) return; const a=nodeById(c,w.f), b=nodeById(c,w.to); ax=(a.x+b.x)/2*s; ay=(a.y+b.y)/2*s; }
  // try right, left, below, above of the anchor; keep the one that covers the fewest neurons
  const pw=box.offsetWidth, ph=box.offsetHeight, g=30*s+12, cl=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
  const cands=[[ax+g,ay-ph/2],[ax-g-pw,ay-ph/2],[ax-pw/2,ay+g],[ax-pw/2,ay-g-ph]].map(([x,y])=>[cl(x,8,bw-pw-8),cl(y,8,bh-ph-8)]);
  const cover=([x,y])=>c.nodes.reduce((m,n)=>{ const r=(n.t==="in"?32:R+14)*s; const px=n.x*s+(n.t==="in"?0:0), py=n.y*s;
    return m+(px+r>x&&px-r<x+pw&&py+r>y&&py-r<y+ph?1:0)+(Math.hypot(px-ax,py-ay)<1?0:0); },0);
  let best=cands[0], bc=cover(best); cands.slice(1).forEach(cn=>{ const v=cover(cn); if(v<bc){ bc=v; best=cn; } });
  box.style.left=best[0]+"px"; box.style.top=best[1]+"px";
}
function field(id,label,val,min,max,step){ return `<div class="field"><label for="${id}">${label}</label><input id="${id}" type="number" min="${min}" max="${max}" step="${step}" value="${val}"></div>`; }
function bind(id,set){ const el=$(id); el.addEventListener("input",()=>{ const v=parseFloat(el.value); if(!isFinite(v)) return; set(Math.min(+el.max,Math.max(+el.min,v))); renderResults(true); }); }

function fit(cv,h){ const r=cv.getBoundingClientRect(); const dpr=window.devicePixelRatio||1; const w=Math.max(10,r.width); cv.width=Math.round(w*dpr); cv.height=Math.round((h?h:w*H/W)*dpr); if(h) cv.style.height=h+"px"; return {w, h:(h?h:w*H/W), dpr}; }

function drawBoard(){
  const {w,h,dpr}=fit(board); const s=w/W, k=tok(), c=circ();

  for(let y=0;y<=H;y+=20){ bctx.strokeStyle=y%100===0?k.grid2:k.grid; bctx.beginPath(); bctx.moveTo(0,y); bctx.lineTo(W,y); bctx.stroke(); }
  // which nodes fired in the selected test
  const fired=new Set(); if(state&&state.runs[selTest]) for(const [id,sp] of state.runs[selTest].spikes) if(sp.length) fired.add(id);
  // wires
  c.wires.forEach(wr=>{ const a=nodeById(c,wr.f), b=nodeById(c,wr.to); if(!a||!b) return;
    const rev=c.wires.some(x=>x.f===wr.to&&x.to===wr.f); const inh=a.t==="gaba";
    const dx=b.x-a.x, dy=b.y-a.y, L=Math.hypot(dx,dy)||1, ux=dx/L, uy=dy/L, off=rev?7:0;
    const ox=-uy*off, oy=ux*off; const ra=a.t==="in"?24:R, rb=b.t==="in"?24:R+ (b.t==="out"?4:0);
    const x1=a.x+ux*ra+ox, y1=a.y+uy*ra+oy, x2=b.x-ux*(rb+2)+ox, y2=b.y-uy*(rb+2)+oy;
    const selected=sel&&sel.kind==="wire"&&sel.id===wr.id;
    bctx.strokeStyle=inh?k.gaba:k.ink; bctx.lineWidth=selected?4:2; if(selected){ bctx.save(); bctx.globalAlpha=.25; bctx.lineWidth=10; bctx.beginPath(); bctx.moveTo(x1,y1); bctx.lineTo(x2,y2); bctx.stroke(); bctx.restore(); }
    bctx.beginPath(); bctx.moveTo(x1,y1); bctx.lineTo(x2,y2); bctx.stroke();
    bctx.fillStyle=bctx.strokeStyle;
    if(inh){ bctx.beginPath(); bctx.moveTo(x2-uy*8,y2+ux*8); bctx.lineTo(x2+uy*8,y2-ux*8); bctx.lineWidth=3; bctx.stroke(); }
    else { bctx.beginPath(); bctx.moveTo(x2,y2); bctx.lineTo(x2-ux*11-uy*5,y2-uy*11+ux*5); bctx.lineTo(x2-ux*11+uy*5,y2-uy*11-ux*5); bctx.closePath(); bctx.fill(); }
    const mx=(x1+x2)/2-uy*12, my=(y1+y2)/2+ux*12;
    const lbl=`${inh?"−":""}${(+wr.w).toFixed(2).replace(/0$/,"")} · ${(+wr.d)}ms`;
    bctx.font=`500 11px ${getComputedStyle(document.body).getPropertyValue("--mono")||"monospace"}`; bctx.textAlign="center"; bctx.textBaseline="middle";
    const tw=bctx.measureText(lbl).width+8; bctx.fillStyle=k.panel2; bctx.fillRect(mx-tw/2,my-8,tw,16); bctx.fillStyle=inh?k.gaba:k.muted; bctx.fillText(lbl,mx,my);
  });
  if(preview){ bctx.setLineDash([5,5]); bctx.strokeStyle=k.spike; bctx.lineWidth=2; bctx.beginPath(); bctx.moveTo(preview.x1,preview.y1); bctx.lineTo(preview.x2,preview.y2); bctx.stroke(); bctx.setLineDash([]); }
  // nodes
  const cond=getComputedStyle(document.body).getPropertyValue("--cond")||"sans-serif";
  c.nodes.forEach(n=>{ const col=colorOf(k,n.t); const selected=(sel&&sel.kind==="node"&&sel.id===n.id)||(hover&&hover.target===n.id&&drag&&drag.wireFrom&&n.t!=="in"&&n!==drag.wireFrom);
    bctx.lineWidth=2.5; bctx.strokeStyle=col;
    if(n.t==="in"){ roundRect(n.x-24,n.y-17,48,34,6); bctx.fillStyle=k.panel2; bctx.fill(); bctx.stroke();
      bctx.fillStyle=k.ink; bctx.font=`700 18px ${cond}`; bctx.textAlign="center"; bctx.textBaseline="middle"; bctx.fillText(n.id,n.x,n.y+1); }
    else { bctx.beginPath(); bctx.arc(n.x,n.y,R,0,Math.PI*2); bctx.fillStyle=k.panel2; bctx.fill(); bctx.globalAlpha=.16; bctx.fillStyle=col; bctx.fill(); bctx.globalAlpha=1; bctx.stroke();
      if(n.t==="out"){ bctx.beginPath(); bctx.arc(n.x,n.y,R+5,0,Math.PI*2); bctx.stroke(); }
      bctx.fillStyle=k.ink; bctx.font=`700 12px ${cond}`; bctx.textAlign="center"; bctx.textBaseline="middle"; bctx.fillText(n.t==="out"?"OUT":n.id.replace("n",""),n.x,n.y+1);
      bctx.fillStyle=col; bctx.font=`700 10px ${cond}`; bctx.fillText(n.t==="gaba"?"ГАМК":"ГЛУТ",n.x,n.y+R+(n.t==="out"?15:11)); }
    if(fired.has(n.id)){ bctx.save(); bctx.strokeStyle=k.spike; bctx.lineWidth=3; bctx.globalAlpha=.9; bctx.shadowColor=k.spike; bctx.shadowBlur=10; bctx.beginPath();
      if(n.t==="in") roundRect(n.x-28,n.y-21,56,42,8); else bctx.arc(n.x,n.y,(n.t==="out"?R+5:R)+4,0,Math.PI*2); bctx.stroke(); bctx.restore(); }
    // output port: drag from here to make a wire
    const pp=portPos(n), hot=hover&&hover.port===n.id;
    bctx.beginPath(); bctx.arc(pp.x,pp.y,hot?7.5:6,0,Math.PI*2); bctx.fillStyle=hot?col:k.panel2; bctx.fill(); bctx.lineWidth=2; bctx.strokeStyle=col; bctx.stroke();
    if(selected){ bctx.setLineDash([4,4]); bctx.strokeStyle=k.ink; bctx.lineWidth=2; bctx.beginPath(); if(n.t==="in") roundRect(n.x-32,n.y-25,64,50,9); else bctx.arc(n.x,n.y,(n.t==="out"?R+5:R)+10,0,Math.PI*2); bctx.stroke(); bctx.setLineDash([]); }
  });
  drawFirstHint();
}
function drawFirstHint(){ const h=$("boardhint"); h.hidden=wired; if(!wired) h.textContent=S[lang].firsthint; }
function portPos(n){ const r=n.t==="in"?24:n.t==="out"?R+5:R; return {x:n.x+r+8, y:n.y}; }
function roundRect(x,y,w,h,r){ bctx.beginPath(); bctx.moveTo(x+r,y); bctx.arcTo(x+w,y,x+w,y+h,r); bctx.arcTo(x+w,y+h,x,y+h,r); bctx.arcTo(x,y+h,x,y,r); bctx.arcTo(x,y,x+w,y,r); bctx.closePath(); }

function drawRaster(){
  if(!state) return; const c=circ(), run=state.runs[selTest]; const rows=c.nodes.slice().sort((a,b)=>(a.t==="in"?0:a.t==="out"?2:1)-(b.t==="in"?0:b.t==="out"?2:1));
  const rowH=18, top=48, left=64, bottom=22; const hh=top+rows.length*rowH+bottom;
  const {w,dpr}=fit(raster,hh); const k=tok(); const mono=getComputedStyle(document.body).getPropertyValue("--mono")||"monospace";
  rctx.setTransform(dpr,0,0,dpr,0,0); rctx.clearRect(0,0,w,hh); rctx.fillStyle=k.panel2; rctx.fillRect(0,0,w,hh);
  const X=t=>left+(w-left-14)*t/run.T;
  // time grid
  rctx.font=`11px ${mono}`; rctx.fillStyle=k.muted; rctx.textAlign="center"; rctx.textBaseline="top";
  for(let t=0;t<=run.T;t+=10){ rctx.strokeStyle=k.grid; rctx.lineWidth=1; rctx.beginPath(); rctx.moveTo(X(t),6); rctx.lineTo(X(t),hh-bottom); rctx.stroke(); rctx.fillText(t+(t===run.T?" ms":""),X(t),hh-bottom+5); }
  // output voltage trace with threshold
  const out=nodeById(c,"OUT"); const vmax=Math.max(1.5,(+out.th||1)*1.4), vmin=-1.5; const Y=v=>6+(top-12)*(1-(v-vmin)/(vmax-vmin));
  rctx.setLineDash([4,4]); rctx.strokeStyle=k.muted; rctx.beginPath(); rctx.moveTo(left,Y(+out.th||1)); rctx.lineTo(w-14,Y(+out.th||1)); rctx.stroke(); rctx.setLineDash([]);
  rctx.fillStyle=k.muted; rctx.textAlign="right"; rctx.textBaseline="middle"; rctx.fillText("V(OUT)",left-8,Y(0)); rctx.fillText("θ",left-8,Y(+out.th||1));
  rctx.strokeStyle=k.glut; rctx.lineWidth=1.6; rctx.beginPath(); run.trace.forEach((v,i)=>{ const x=X(i*run.dt), y=Y(Math.max(vmin,Math.min(vmax,v))); i?rctx.lineTo(x,y):rctx.moveTo(x,y); }); rctx.stroke();
  // raster rows
  rows.forEach((n,r)=>{ const y=top+r*rowH+rowH/2; rctx.fillStyle=k.ink; rctx.textAlign="right"; rctx.fillText(n.t==="out"?"OUT":n.id,left-8,y);
    rctx.strokeStyle=k.grid; rctx.beginPath(); rctx.moveTo(left,y); rctx.lineTo(w-14,y); rctx.stroke();
    rctx.strokeStyle=n.t==="gaba"?k.gaba:n.t==="in"?k.inn:k.spike; rctx.lineWidth=2.5;
    (run.spikes.get(n.id)||[]).forEach(t=>{ rctx.beginPath(); rctx.moveTo(X(t),y-7); rctx.lineTo(X(t),y+7); rctx.stroke(); }); rctx.lineWidth=1; });
}

// ---------- editing on the board ----------
function pos(e){ const r=board.getBoundingClientRect(); const s=r.width/W; return {x:(e.clientX-r.left)/s, y:(e.clientY-r.top)/s}; }
const snap=v=>Math.round(v/20)*20;
function nodeAt(p){ const c=circ(); for(let i=c.nodes.length-1;i>=0;i--){ const n=c.nodes[i]; if(n.t==="in"? Math.abs(p.x-n.x)<=26&&Math.abs(p.y-n.y)<=19 : Math.hypot(p.x-n.x,p.y-n.y)<=R+6) return n; } return null; }
function wireAt(p){ const c=circ(); let bestW=null, bd=Math.max(8,hitR(10)); c.wires.forEach(wr=>{ const a=nodeById(c,wr.f), b=nodeById(c,wr.to); if(!a||!b) return; const dx=b.x-a.x, dy=b.y-a.y, L=Math.hypot(dx,dy)||1, L2=L*L; let t=((p.x-a.x)*dx+(p.y-a.y)*dy)/L2; t=Math.max(0,Math.min(1,t)); let d=Math.hypot(p.x-(a.x+t*dx),p.y-(a.y+t*dy));
    const lx=(a.x+b.x)/2-dy/L*12, ly=(a.y+b.y)/2+dx/L*12; if(Math.abs(p.x-lx)<=34&&Math.abs(p.y-ly)<=10) d=Math.min(d,1); if(d<bd){bd=d;bestW=wr;} }); return bestW; }
function addNeuron(t,p){ const c=circ(), ch=CH[cur]; if(!ch.allowed.includes(t)) return; const id="n"+(c.next++); const x=Math.min(W-40,Math.max(40,snap(p.x))), y=Math.min(H-30,Math.max(30,snap(p.y))); c.nodes.push({id,t,x,y,tau:5,th:1}); sel={kind:"node",id}; renderResults(); }
function freeSpot(){ const c=circ(); for(const y of [220,140,300,80,360]) for(const x of [380,260,500,200,560,320,440]) if(c.nodes.every(n=>Math.hypot(n.x-x,n.y-y)>=70)) return {x,y}; return {x:380,y:220}; }
function removeSel(){ const c=circ(); if(!sel) return; if(sel.kind==="node"){ const n=nodeById(c,sel.id); if(!n||n.t==="in"||n.t==="out") return; c.nodes=c.nodes.filter(x=>x.id!==n.id); c.wires=c.wires.filter(w=>w.f!==n.id&&w.to!==n.id); } else c.wires=c.wires.filter(w=>w.id!==sel.id); sel=null; renderResults(); }
// hit radius in board units: at least 12 CSS px so ports stay usable on a phone
function hitR(px){ const s=board.getBoundingClientRect().width/W; return Math.max(px*0.75, px/s); }
function inBody(n,p){ return n.t==="in"? Math.abs(p.x-n.x)<=24&&Math.abs(p.y-n.y)<=17 : Math.hypot(p.x-n.x,p.y-n.y)<=(n.t==="out"?R+5:R); }
function portAt(p){ const c=circ(), r=hitR(14); if(c.nodes.some(n=>inBody(n,p))) return null;
  for(let i=c.nodes.length-1;i>=0;i--){ const n=c.nodes[i], pp=portPos(n); if(Math.hypot(p.x-pp.x,p.y-pp.y)<=r) return n; } return null; }
board.addEventListener("pointerdown",e=>{ const p=pos(e), pn=portAt(p), n=pn?null:nodeAt(p), wr=(pn||n)?null:wireAt(p); board.setPointerCapture(e.pointerId);
  if(pn){ const pp=portPos(pn); drag={wireFrom:pn}; preview={x1:pp.x,y1:pp.y,x2:p.x,y2:p.y}; drawBoard(); return; }
  if(n){ sel={kind:"node",id:n.id}; drag={node:n,moved:false}; } else if(wr){ sel={kind:"wire",id:wr.id}; } else sel=null;
  renderResults();
});
board.addEventListener("pointermove",e=>{ const p=pos(e);
  if(!drag){ const pn=portAt(p), n=pn?null:nodeAt(p), wr=(pn||n)?null:wireAt(p); const h={port:pn&&pn.id};
    board.style.cursor=pn?"crosshair":n?"grab":wr?"pointer":"default"; if((hover&&hover.port)!==h.port){ hover=h; drawBoard(); } else hover=h; return; }
  if(drag.node){ const nx=Math.min(W-40,Math.max(40,snap(p.x))), ny=Math.min(H-30,Math.max(30,snap(p.y))); if(nx!==drag.node.x||ny!==drag.node.y){ drag.node.x=nx; drag.node.y=ny; drag.moved=true; board.style.cursor="grabbing"; drawBoard(); placePop(); } }
  else if(drag.wireFrom){ preview.x2=p.x; preview.y2=p.y; const t=nodeAt(p); hover={port:drag.wireFrom.id,target:t&&t.id}; drawBoard(); } });
board.addEventListener("pointerup",e=>{ const p=pos(e);
  if(drag&&drag.wireFrom){ const t=nodeAt(p), c=circ(), f=drag.wireFrom;
    if(t&&t!==f&&t.t!=="in"&&!c.wires.some(w=>w.f===f.id&&w.to===t.id)){ const id="w"+(c.next++); c.wires.push({id,f:f.id,to:t.id,w:1.2,d:1}); sel={kind:"wire",id}; wired=true; } preview=null; drag=null; hover=null; renderResults(); return; }
  if(drag&&drag.moved){ store(); $("sharecode").value=shareLink(); board.style.cursor="grab"; } drag=null; });
board.addEventListener("pointerleave",()=>{ if(!drag&&hover){ hover=null; drawBoard(); } });
board.addEventListener("dblclick",e=>{ const p=pos(e); if(!nodeAt(p)&&!wireAt(p)&&!portAt(p)&&CH[cur].allowed.includes("glut")) addNeuron("glut",p); });
document.addEventListener("keydown",e=>{ if(e.target instanceof HTMLInputElement) return; if((e.key==="Delete"||e.key==="Backspace")&&sel){ e.preventDefault(); removeSel(); } else if(e.key==="Escape"&&sel){ sel=null; renderResults(); } });
// palette: a click adds at a free spot, a drag onto the board places the neuron where it is dropped
let pdrag=null;
function paletteDown(e,t){ if(e.button!==0) return; e.preventDefault(); pdrag={t,x0:e.clientX,y0:e.clientY,moved:false,ghost:null};
  const col=getComputedStyle(document.documentElement).getPropertyValue(t==="gaba"?"--gaba":"--glut");
  const mv=ev=>{ if(!pdrag.moved&&Math.hypot(ev.clientX-pdrag.x0,ev.clientY-pdrag.y0)>6){ pdrag.moved=true; const g=document.createElement("div"); g.className="ghost-part"; g.style.borderColor=col; document.body.appendChild(g); pdrag.ghost=g; }
    if(pdrag.ghost){ pdrag.ghost.style.left=ev.clientX+"px"; pdrag.ghost.style.top=ev.clientY+"px"; } };
  const up=ev=>{ document.removeEventListener("pointermove",mv); document.removeEventListener("pointerup",up); if(pdrag.ghost) pdrag.ghost.remove();
    const r=board.getBoundingClientRect(), inside=ev.clientX>=r.left&&ev.clientX<=r.right&&ev.clientY>=r.top&&ev.clientY<=r.bottom;
    if(!pdrag.moved) addNeuron(pdrag.t,freeSpot()); else if(inside) addNeuron(pdrag.t,pos(ev)); pdrag=null; };
  document.addEventListener("pointermove",mv); document.addEventListener("pointerup",up); }

// ---------- share ----------
function b64u(s){ return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function unb64u(s){ s=s.replace(/-/g,"+").replace(/_/g,"/"); while(s.length%4) s+="="; return decodeURIComponent(escape(atob(s))); }
function code(){ const c=circ(); return "bb."+b64u(JSON.stringify({c:CH[cur].id,n:c.nodes.filter(n=>n.t!=="in").map(n=>[n.id,n.t,n.x,n.y,+n.tau,+n.th]),w:c.wires.map(w=>[w.f,w.to,+w.w,+w.d])})); }
function shareLink(){ return location.href.split("#")[0]+"#"+code(); }
function loadCode(str){ try{ str=(str||"").trim(); const i=str.indexOf("bb."); if(i<0) throw 0; const o=JSON.parse(unb64u(str.slice(i+3).replace(/[^A-Za-z0-9_-].*$/,""))); const ci=CH.findIndex(x=>x.id===o.c); if(ci<0) throw 0;
    const c=fresh(CH[ci]); c.wires=[]; c.nodes=c.nodes.filter(n=>n.t==="in");
    o.n.forEach(([id,t,x,y,tau,th])=>c.nodes.push({id,t,x,y,tau,th})); o.w.forEach(([f,to,w,d])=>c.wires.push({id:"w"+(c.next++),f,to,w,d}));
    c.nodes.forEach(n=>{ const m=/^n(\d+)$/.exec(n.id); if(m) c.next=Math.max(c.next,+m[1]+1); });
    circuits[o.c]=c; cur=ci; sel=null; selTest=0; return true; }catch(e){ return false; } }
$("copy").onclick=()=>{ const L=S[lang], link=shareLink(), msg=$("sharemsg");
  const done=()=>{ msg.textContent=L.copied; }, fail=()=>{ const el=$("sharecode"); el.focus(); el.select(); msg.textContent=L.copyfail; };
  try{ navigator.clipboard.writeText(link).then(done,fail); }catch(e){ fail(); } };
$("load").onclick=()=>{ const L=S[lang]; if(loadCode($("loadcode").value)){ renderAll(); $("sharemsg").textContent=L.loaded; } else $("sharemsg").textContent=L.badcode; };
$("reset").onclick=()=>{ circuits[CH[cur].id]=fresh(CH[cur]); delete stash[CH[cur].id]; sel=null; renderSol(); renderResults(); };
$("lang-ru").onclick=()=>{ lang="ru"; renderAll(); }; $("lang-en").onclick=()=>{ lang="en"; renderAll(); };

function renderAll(){ renderStatic(); renderResults(); }
if(location.hash.startsWith("#bb.")) loadCode(location.hash.slice(1));
window.addEventListener("resize",()=>{ drawBoard(); drawRaster(); placePop(); });
if(window.matchMedia) window.matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",()=>renderAll());
new MutationObserver(()=>renderAll()).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ drawBoard(); drawRaster(); });
if(location.hash==="#selftest"){
  const lines=[]; let ok=0;
  CH.forEach((ch,i)=>{ cur=i; circuits[ch.id]=fromSol(ch); const t0=performance.now(); const r=evaluate(); const ms=performance.now()-t0;
    if(r.solved) ok++; lines.push(`${r.solved?"PASS":"FAIL"} ${ch.id.padEnd(8)} ${r.passed}/${r.res.length} neurons=${r.neurons} record=${ch.record} ${ms.toFixed(1)}ms`+(r.solved?"":"  "+r.res.map((x,j)=>x.ok?"":"["+ch.tests[j].n.en+" got "+x.got+"]").join(""))); });
  // UI flow: show solution with the in-page confirm, then bring the user's circuit back
  try{ cur=1; circuits={}; stash={}; solSeen={}; renderAll(); const before=JSON.stringify(circ());
    $("solbtn").click(); const asked=!!$("solyes"); $("solyes").click(); const shown=evaluate().solved;
    $("solback").click(); const back=JSON.stringify(circ())===before;
    lines.push(`UI show-solution: confirm=${asked} solved=${shown} restored=${back}`); }catch(e){ lines.push("UI show-solution: ERROR "+e); }
  document.body.innerHTML=`<pre id="selftest">${lines.join("\n")}\nTOTAL ${ok}/${CH.length}</pre>`; document.title=`PASS ${ok}/${CH.length}`;
} else renderAll();
})();
</script>
