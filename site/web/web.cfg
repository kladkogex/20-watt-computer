% TeX4ht configuration for the web edition (make4ht, see site/web/build.sh).
% The book sources are not changed: everything the HTML needs differently is redefined here.
\Preamble{xhtml,2,mathml,svg,charset=utf-8,fn-in}
\makeatletter
% neuron type codes: a styled span instead of the Cyrillic sans-bold font (it has no HTML font mapping)
\renewcommand{\nt}[1]{\HCode{<span class="nt">}#1\HCode{</span>}}
% key formulas (empheq + yellow box; full edition only) become an ordinary equation inside a styled block
\@ifundefined{keybox}{}{\renewcommand{\keybox}[1]{#1}}
\@ifundefined{empheq}{}{\renewenvironment{empheq}[2][]{\def\wb@env{#2}\ifvmode\else\par\fi\HCode{<div class="keyformula">}\begin{#2}}{\expandafter\end\expandafter{\wb@env}\ifvmode\else\par\fi\HCode{</div>}}}
% operators in captions are written to the aux file: keep them unexpanded there
\@for\wb@op:=max,min,lim,sup,inf,log,ln,exp,arg\do{%
  \expandafter\let\csname wb@orig@\wb@op\expandafter\endcsname\csname\wb@op\endcsname
  \expandafter\protected\expandafter\edef\csname\wb@op\endcsname{\expandafter\noexpand\csname wb@orig@\wb@op\endcsname}}
\makeatother
\begin{document}
\EndPreamble
