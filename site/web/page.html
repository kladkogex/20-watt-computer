<!doctype html>
<html lang="{{HTMLLANG}}" dir="{{DIR}}">
<head>
<meta charset="utf-8">
<script>try{var t=localStorage.getItem("20w-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}if(window.self!==window.top)document.documentElement.classList.add("embedded");</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}} · {{BOOKTITLE}}</title>
<meta name="description" content="{{DESC}}">
<link rel="canonical" href="{{CANON}}">
{{ALTERNATES}}
<meta property="og:type" content="book">
<meta property="og:title" content="{{TITLE}} · {{BOOKTITLE}}">
<meta property="og:description" content="{{DESC}}">
<meta property="og:url" content="{{CANON}}">
<meta property="og:locale" content="{{OGLOCALE}}">
<meta property="og:image" content="https://kladkogex.github.io/20-watt-computer/og-card.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Your brain runs on 20 watts. Here is its datasheet. The 20-Watt Computer, a free textbook for engineers.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://kladkogex.github.io/20-watt-computer/og-card.png">
<meta name="twitter:title" content="{{TITLE}} · {{BOOKTITLE}}">
<meta name="twitter:description" content="{{DESC}}">
<script type="application/ld+json">{{JSONLD}}</script>
<link rel="stylesheet" href="{{FONTS}}">
<link rel="stylesheet" href="book.css">
</head>
<body>
<header class="bar">
  <a class="home" href="../../#toc"><span class="w">20</span> <span>{{BOOKTITLE}}</span></a>
  <label class="jump"><span class="sr">{{UI_GOTO}}</span>
    <select id="jump"></select></label>
  <div class="langs" role="group" aria-label="Language and theme">
    <label class="sr" for="edition">{{UI_EDITION}}</label>
    <select class="chip edition" id="edition" aria-label="{{UI_EDITION}}">{{EDITIONS}}</select>
    <button class="chip theme" id="theme" type="button" aria-label="Light or dark theme" title="Light / dark">☾</button>
  </div>
</header>

<main class="page">
  <div class="pagehead">
    <p class="kicker">{{KICKER}}</p>
    <h1><span class="t-full">{{FTITLE}}</span><span class="t-short">{{STITLE}}</span></h1>
    <div class="mode" role="group" aria-label="Version" data-has-short="{{HASSHORT}}">
      <button type="button" class="seg" data-mode="short"><b>{{UI_SHORT}}</b><span>{{UI_SHORT_SUB}}</span></button>
      <button type="button" class="seg" data-mode="full"><b>{{UI_FULL}}</b><span>{{UI_FULL_SUB}}</span></button>
    </div>
  </div>

  <article class="text full" id="text-full">
{{FULL}}
  </article>
  <article class="text short" id="text-short" hidden>
{{SHORT}}
  </article>

  <aside class="starline"><span>{{UI_STARLINE}}</span> <a href="https://github.com/kladkogex/20-watt-computer" target="_blank" rel="noopener">★ {{UI_STAR}}</a></aside>
  <nav class="pager">
    <a class="prev" href="{{PREV}}"><span>{{ARROW_PREV}} {{UI_PREV}}</span><b>{{PREV_TITLE}}</b></a>
    <a class="next" href="{{NEXT}}"><span>{{UI_NEXT}} {{ARROW_NEXT}}</span><b>{{NEXT_TITLE}}</b></a>
  </nav>
  <footer>
    <span><a href="../../author/">{{AUTHOR}}</a> · <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/">CC BY-NC-SA 4.0</a></span>
    <span><a href="../../pdf/20-watt-computer-{{LANG}}.pdf">PDF</a> · <a href="../../breadboard/">{{UI_BREADBOARD}}</a> · <a href="https://github.com/kladkogex/20-watt-computer">GitHub</a></span>
  </footer>
</main>

<script>
(function(){
  const NAV = {{NAV}};
  const SLUG = "{{SLUG}}";
  const store = {get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

  // chapter selector
  const sel = document.getElementById("jump");
  NAV.forEach(p => { const o = document.createElement("option"); o.value = p.slug;
    o.textContent = (p.kicker ? p.kicker + ". " : "") + p.title; if (p.slug === SLUG) o.selected = true; sel.appendChild(o); });
  sel.addEventListener("change", () => { location.href = sel.value + ".html" + (location.hash === "#short" ? "#short" : ""); });

  // the same chapter in another edition
  const ed = document.getElementById("edition");
  ed.addEventListener("change", () => { store.set("20w-read-lang", ed.value); location.href = "../" + ed.value + "/" + SLUG + ".html" + (document.body.dataset.mode === "short" ? "#short" : ""); });

  // short / full
  const modeBox = document.querySelector(".mode");
  const hasShort = modeBox.dataset.hasShort === "true";
  const full = document.getElementById("text-full"), short = document.getElementById("text-short");
  function setMode(m, remember){
    if (!hasShort) m = "full";
    document.body.dataset.mode = m;
    full.hidden = m !== "full"; short.hidden = m !== "short";
    modeBox.querySelectorAll(".seg").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === m));
    if (remember) store.set("20w-mode", m);
  }
  if (!hasShort) modeBox.hidden = true;
  modeBox.addEventListener("click", e => { const b = e.target.closest(".seg"); if (b) { setMode(b.dataset.mode, true); history.replaceState(null, "", "#" + b.dataset.mode); } });
  document.addEventListener("click", e => { const a = e.target.closest("a[data-mode]"); if (a) { e.preventDefault(); setMode(a.dataset.mode, true); window.scrollTo(0, 0); } });
  // a link into the text (#x...) that lives in the other version switches to it
  function follow(){
    const h = decodeURIComponent(location.hash.slice(1));
    if (h === "short" || h === "full") { setMode(h, true); return; }
    if (!h) return;
    const t = document.getElementById(h);
    if (t) { setMode(short.contains(t) ? "short" : "full", false); t.scrollIntoView(); }
  }
  setMode(store.get("20w-mode") || "full", false);
  follow();
  window.addEventListener("hashchange", follow);
  // inside the single-page reader: links that leave the book open in the whole window
  if (document.documentElement.classList.contains("embedded"))
    document.querySelectorAll('a[href^="../../"], a[href^="http"]').forEach(a => { a.target = a.href.startsWith(location.origin) ? "_top" : "_blank"; });
  window.addEventListener("storage", e => {
    if (e.key === "20w-theme" && (e.newValue === "light" || e.newValue === "dark")) document.documentElement.setAttribute("data-theme", e.newValue);
  });
})();
</script>
<script>
(function(){var b=document.getElementById("theme");if(!b)return;var r=document.documentElement;function cur(){var t=r.getAttribute("data-theme");if(t)return t;return window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";}function show(){b.textContent=cur()==="dark"?"☀":"☾";b.setAttribute("aria-pressed",cur()==="dark");}b.onclick=function(){var t=cur()==="dark"?"light":"dark";r.setAttribute("data-theme",t);try{localStorage.setItem("20w-theme",t);}catch(e){}show();};if(window.matchMedia)matchMedia("(prefers-color-scheme: dark)").addEventListener("change",show);show();})();
</script>
</body>
</html>
