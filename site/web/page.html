<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}} · Компьютер на 20 ваттах</title>
<meta name="description" content="{{DESC}}">
<link rel="canonical" href="{{CANON}}">
<meta property="og:type" content="book">
<meta property="og:title" content="{{TITLE}} · Компьютер на 20 ваттах">
<meta property="og:description" content="{{DESC}}">
<meta property="og:url" content="{{CANON}}">
<meta property="og:locale" content="ru_RU">
<script type="application/ld+json">{{JSONLD}}</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&display=swap">
<link rel="stylesheet" href="book.css">
</head>
<body>
<header class="bar">
  <a class="home" href="../#toc"><span class="w">20</span> <span data-ru="Компьютер на 20 ваттах" data-en="The 20-Watt Computer">Компьютер на 20 ваттах</span></a>
  <label class="jump"><span class="sr" data-ru="Перейти к главе" data-en="Go to chapter">Перейти к главе</span>
    <select id="jump"></select></label>
  <div class="langs" role="group" aria-label="Language">
    <button class="chip" id="lang-ru" type="button">RU</button>
    <button class="chip" id="lang-en" type="button">EN</button>
  </div>
</header>

<main class="page">
  <div class="pagehead">
    <p class="kicker" data-ru="{{KICKER_RU}}" data-en="{{KICKER_EN}}">{{KICKER_RU}}</p>
    <h1><span class="t-full">{{FTITLE}}</span><span class="t-short">{{STITLE}}</span></h1>
    <div class="mode" role="group" aria-label="Version" data-has-short="{{HASSHORT}}">
      <button type="button" class="seg" data-mode="short"><b data-ru="Коротко" data-en="Short">Коротко</b><span data-ru="без формул, с рисунками" data-en="no formulas, with drawings">без формул, с рисунками</span></button>
      <button type="button" class="seg" data-mode="full"><b data-ru="Полностью" data-en="Full">Полностью</b><span data-ru="формулы, модели, задачи" data-en="formulas, models, exercises">формулы, модели, задачи</span></button>
    </div>
    <p class="lang-note" data-ru="" data-en="The text of the book is in Russian for now; the English edition is in progress.">.</p>
  </div>

  <article class="text full" id="text-full">
{{FULL}}
  </article>
  <article class="text short" id="text-short" hidden>
{{SHORT}}
  </article>

  <nav class="pager">
    <a class="prev" href="{{PREV}}"><span data-ru="← Назад" data-en="← Previous">← Назад</span><b>{{PREV_TITLE}}</b></a>
    <a class="next" href="{{NEXT}}"><span data-ru="Дальше →" data-en="Next →">Дальше →</span><b>{{NEXT_TITLE}}</b></a>
  </nav>
  <footer>
    <span data-ru='Константин Кладько · текст — <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/deed.ru">CC BY-NC-SA 4.0</a>' data-en='Konstantin Kladko · text: <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/">CC BY-NC-SA 4.0</a>'>Константин Кладько</span>
    <span><a href="../pdf/20-watt-computer-ru.pdf">PDF</a> · <a href="../breadboard/" data-ru="Макетная плата" data-en="Breadboard">Макетная плата</a> · <a href="https://github.com/kladkogex/20-watt-computer">GitHub</a></span>
  </footer>
</main>

<script>
(function(){
  const NAV = {{NAV}};
  const SLUG = "{{SLUG}}";
  const store = {get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

  // chapter selector
  const sel = document.getElementById("jump");
  NAV.forEach(p => { const o = document.createElement("option"); o.value = p.slug;
    o.textContent = (p.kicker ? p.kicker + ". " : "") + p.title; if (p.slug === SLUG) o.selected = true; sel.appendChild(o); });
  sel.addEventListener("change", () => { location.href = sel.value + ".html" + (location.hash === "#short" ? "#short" : ""); });

  // Коротко / Полностью
  const modeBox = document.querySelector(".mode");
  const hasShort = modeBox.dataset.hasShort === "true";
  const full = document.getElementById("text-full"), short = document.getElementById("text-short");
  function setMode(m, remember){
    if (!hasShort) m = "full";
    document.body.dataset.mode = m;
    full.hidden = m !== "full"; short.hidden = m !== "short";
    modeBox.querySelectorAll(".seg").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === m));
    if (remember) store.set("20w-mode", m);
  }
  if (!hasShort) modeBox.hidden = true;
  modeBox.addEventListener("click", e => { const b = e.target.closest(".seg"); if (b) { setMode(b.dataset.mode, true); history.replaceState(null, "", "#" + b.dataset.mode); } });
  document.addEventListener("click", e => { const a = e.target.closest("a[data-mode]"); if (a) { e.preventDefault(); setMode(a.dataset.mode, true); window.scrollTo(0, 0); } });
  // a link into the text (#x...) that lives in the other version switches to it
  function follow(){
    const h = decodeURIComponent(location.hash.slice(1));
    if (h === "short" || h === "full") { setMode(h, true); return; }
    if (!h) return;
    const t = document.getElementById(h);
    if (t) { setMode(short.contains(t) ? "short" : "full", false); t.scrollIntoView(); }
  }
  setMode(store.get("20w-mode") || "full", false);
  follow();
  window.addEventListener("hashchange", follow);

  // interface language (the text itself is Russian)
  function setLang(l){
    document.querySelectorAll("[data-ru]").forEach(el => { el.innerHTML = el.dataset[l]; });
    document.getElementById("lang-ru").setAttribute("aria-pressed", l === "ru");
    document.getElementById("lang-en").setAttribute("aria-pressed", l === "en");
    store.set("20w-lang", l);
  }
  document.getElementById("lang-ru").onclick = () => setLang("ru");
  document.getElementById("lang-en").onclick = () => setLang("en");
  setLang(store.get("20w-lang") === "en" ? "en" : "ru");
})();
</script>
</body>
</html>
